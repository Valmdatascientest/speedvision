name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      local_model_validation:
        description: 'Run AGPL model tests on the runner; no model/APK artifact is published'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r scripts/requirements-calibration.txt
      - run: ./scripts/check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-apk
          path: |
            app/build/reports
            domain/build/reports
            app/build/outputs/apk/debug/*.apk
  meta-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew spotlessCheck :domain:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest -PmetaEnabled=true
      - run: python3 scripts/audit_android_manifest.py --meta
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meta-reports-only
          path: |
            app/build/reports
            domain/build/reports
  device-tests:
    strategy:
      fail-fast: false
      matrix:
        meta: ['false', 'true']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: ./gradlew :app:connectedDebugAndroidTest -PmetaEnabled=${{ matrix.meta }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports-meta-${{ matrix.meta }}
          path: app/build/reports/androidTests

  model-validation:
    if: github.event_name == 'workflow_dispatch' && inputs.local_model_validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: pip install -r scripts/requirements-models.txt
      - run: python scripts/prepare_models.py --accept-agpl
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.requireModels=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-test-reports-only
          path: app/build/reports/androidTests
